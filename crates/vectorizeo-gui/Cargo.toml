[package]
name = "vectorizeo-gui"
version = "0.1.0"
edition = "2024"
# The other bin, vectorizeo-worker, is the web build's Web Worker.
default-run = "vectorizeo-gui"
description = "Desktop and web GUI for the vectorizeo bitmap-to-vector tracer"

[features]
default = ["glow"]
# Renderer backend; with `wgpu` enabled it is used instead of glow (native only; the web build
# renders with WebGL through glow).
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dependencies]
vectorizeo-core = { path = "../vectorizeo-core" }
vectorizeo-pipeline = { path = "../vectorizeo-pipeline", features = ["serde"] }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "accesskit", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
rfd = "0.17.2"
web-time = "1.1"
serde = { version = "1", features = ["derive", "rc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "DedicatedWorkerGlobalScope",
    "ErrorEvent",
    "MessageEvent",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }
