<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>vectorizeo</title>
    <link data-trunk rel="rust" data-bin="vectorizeo-gui" data-type="main" data-wasm-opt="0">
    <link data-trunk rel="rust" data-bin="vectorizeo-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-wasm-opt="0">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ecedf1; }
        @media (prefers-color-scheme: dark) { html, body { background: #121316; } }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
        #loading {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            font: 15px system-ui, sans-serif; color: #6b7080;
        }
    </style>
</head>
<body>
    <canvas id="vectorizeo"></canvas>
    <div id="loading">Loading vectorizeo…</div>
</body>
</html>
