[package]
name = "vectorizeo"
version = "0.1.0"
edition = "2024"

[dependencies]
vectorizeo-core = { path = "../vectorizeo-core" }
vectorizeo-pipeline = { path = "../vectorizeo-pipeline" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
crossterm = "0.29"
base64 = "0.22"
